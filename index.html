<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#121212" />
    <meta name="description" content="Personal Cloud Music Player streaming from Google Drive" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Cloud Music Player</title>

    <!-- Strict Content Security Policy (CSP) for Google Drive PWA -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline' https://accounts.google.com https://apis.google.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://*.googleusercontent.com https://drive-thirdparty.googleusercontent.com; media-src 'self' blob: https://*.googleapis.com; connect-src 'self' https://accounts.google.com https://apis.google.com https://*.googleapis.com; frame-src https://accounts.google.com https://docs.google.com; worker-src 'self' blob:;"
    />

    <!-- Web App Manifest -->
    <link rel="manifest" href="/manifest.json" />

    <!-- Google Identity Services (GIS) Web SDK -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <!-- Google API Client Library (Required for Google Picker) -->
    <script src="https://apis.google.com/js/api.js" async defer></script>
  </head>
  <body class="bg-neutral-950 text-neutral-100 antialiased selection:bg-emerald-500 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
